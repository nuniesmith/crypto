# ============================================================================
# Build the crypto-bot image and push it to GHCR.
#
# The oryx deploy repo pulls ghcr.io/nuniesmith/crypto:latest instead of
# building the Rust binary on the host — faster deploys, no toolchain needed
# on oryx. No secrets are baked into the image (they come from .env at
# runtime), so the package can stay public.
# ============================================================================
name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - bot/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build + push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nuniesmith/crypto
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
