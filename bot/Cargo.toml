[package]
name = "crypto-bot"
version = "0.1.0"
edition = "2021"
description = "Live Kraken bot — exchange-apiws + indicators-ta + rustrade"
publish = false

[dependencies]
# Published crates (nuniesmith), from crates.io. Path overrides go in [patch] for local work.
exchange-apiws = { version = "0.12", default-features = false, features = ["kraken"] }
indicators-ta = "0.3.1"
rustrade-framework = "0.5.2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
axum = { version = "0.7", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
