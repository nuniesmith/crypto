# ============================================================================
# Build the crypto-bot image and push it to GHCR.
#
# The oryx deploy repo pulls ghcr.io/nuniesmith/crypto:latest instead of
# building the Rust binary on the host — faster deploys, no toolchain needed
# on oryx. No secrets are baked into the image (they come from .env at
# runtime), so the package can stay public.
# ============================================================================
name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - bot/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build + push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nuniesmith/crypto
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A merge reaches the live bot on its own. Oryx's compose pulls
      # :latest, but only when oryx's own deploy runs, so a new image used to
      # sit unused until someone ran it by hand. This starts that deploy
      # (nuniesmith/oryx ci-cd.yml), which pulls :latest and recreates
      # crypto-bot-live. Runs after the push above, so :latest is this commit.
      #
      # ORYX_DEPLOY_TOKEN is a fine-grained PAT with Actions: write on
      # nuniesmith/oryx; GITHUB_TOKEN cannot start a workflow in another
      # repository. A missing token FAILS this job rather than skipping it: a
      # silent skip is a deploy that never happened, reported as green.
      - name: Roll the new image out on oryx
        env:
          GH_TOKEN: ${{ secrets.ORYX_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORYX_DEPLOY_TOKEN is not set, so oryx keeps running the previous image"
            exit 1
          fi
          gh workflow run ci-cd.yml --repo nuniesmith/oryx
          echo "Requested: ${{ github.server_url }}/nuniesmith/oryx/actions/workflows/ci-cd.yml"
