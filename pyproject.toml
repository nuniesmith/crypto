[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-scalper"
version = "0.1.0"
description = "Kraken 1h SOL/ETH research + paper/live bot — fee-aware walk-forward, not 1m scalps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }
authors = [{ name = "nuniesmith" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "optuna>=3.6",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
]
live = [
    "ccxt>=4.0",
]

[project.scripts]
crypto = "crypto.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
