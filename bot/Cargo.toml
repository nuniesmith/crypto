[package]
name = "crypto-bot"
version = "0.1.0"
edition = "2021"
description = "Paper/live Kraken bot — rustrade + indicators-ta + exchange-apiws"
publish = false

[dependencies]
# Published crates (nuniesmith). Path overrides stay in [patch] for local work.
exchange-apiws = { git = "https://github.com/nuniesmith/exchange-apiws", rev = "50874dc274f54bbb3b35aa27a3e5ed9a3d3ec6e9", default-features = false, features = ["kraken"] }
indicators-ta = "0.3"
rustrade-framework = "0.5.2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
