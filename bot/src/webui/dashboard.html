<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Bot</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><img src="/favicon.svg" alt="">Crypto Bot</h1>
    <span class="status"><span class="dot off" id="dot"></span><span id="stext">Stopped</span></span>
  </div>
  <nav>
    <a href="/" class="on">Dashboard</a>
    <a href="/forecast">Forecast calculator</a>
  </nav>

  <div class="kpi">
    <div class="card"><div class="v" id="ktotal">$–</div><div class="l" id="ltotal">Total value</div></div>
    <div class="card"><div class="v" id="kcash" style="color:var(--acc)">$–</div><div class="l">Cash</div></div>
    <div class="card"><div class="v" id="kkraken" style="color:var(--mut)">–</div><div class="l">Kraken link</div></div>
  </div>

  <div class="card">
    <div class="btnrow">
      <button class="btn" id="bstart" onclick="ctl('start')">Start bot</button>
      <button class="btn stop" id="bstop" onclick="ctl('stop')">Stop bot</button>
    </div>
    <div class="err" id="err"></div>
    <p class="note">Start launches the live trading loop (real Kraken orders).
    Stop kills it. The web UI keeps running either way.</p>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Pair</th><th>Regime</th><th class="n">Target</th>
      <th class="n">Holding</th><th class="n">Holding %</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="note">loading…</td></tr></tbody>
    </table>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const fmt$=n=>'$'+Math.round(n).toLocaleString('en-US');
async function refresh(){
  try{
    const r=await fetch('/api/status'); const s=await r.json();
    if($('err').textContent==='status fetch failed') $('err').textContent='';
    $('dot').className='dot '+(s.running?'on':'off');
    $('stext').textContent=s.running?'Running':'Stopped';
    $('bstart').disabled=s.running; $('bstop').disabled=!s.running;
    // Without Kraken every live figure is 0: show the last daily snapshot instead.
    const stale=!s.kraken_ok&&s.last_known_total_usd!=null;
    $('ktotal').textContent=fmt$(stale?s.last_known_total_usd:s.total_usd);
    $('ltotal').textContent=stale?'Total value (last known, '+s.last_known_date+')':'Total value';
    const live=n=>s.kraken_ok?fmt$(n):'$–';
    $('kcash').textContent=live(s.cash_usd)+'  ('+s.cash_target_pct.toFixed(1)+'% tgt)';
    $('kkraken').textContent=s.kraken_ok?'connected':'not connected';
    $('kkraken').style.color=s.kraken_ok?'var(--grn)':'var(--mut)';
    const tb=$('rows'); tb.innerHTML='';
    s.pairs.forEach(p=>{
      const tr=document.createElement('tr');
      const reg=p.bull==null?'<span class="note">—</span>':
        p.bull?'<span class="bull">BULL</span>':'<span class="bear">BEAR</span>';
      const coin=p.pair.replace('USD','').replace(/^XBT$/,'BTC');
      tr.innerHTML='<td><b>'+coin+'</b></td><td>'+reg+'</td>'+
        '<td class="n">'+p.target_pct.toFixed(1)+'%</td>'+
        '<td class="n">'+live(p.holding_usd)+'</td>'+
        '<td class="n">'+(s.kraken_ok?p.holding_pct.toFixed(1)+'%':'–')+'</td>';
      tb.appendChild(tr);
    });
  }catch(e){ $('err').textContent='status fetch failed'; }
}
async function ctl(which){
  $('err').textContent='';
  try{
    const r=await fetch('/api/'+which,{method:'POST'});
    const j=await r.json();
    if(!j.ok) $('err').textContent=j.error||'failed';
  }catch(e){ $('err').textContent='request failed'; }
  refresh();
}
refresh(); setInterval(refresh,30000);
</script>
</body>
</html>
